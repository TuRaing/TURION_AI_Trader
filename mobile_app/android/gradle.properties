org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Added 04-Aug-2026 - webview_flutter_android's Kotlin compilation was
# crashing ("this and base files have different roots") because the
# project (D:) and the pub package cache (C:) are on different drives -
# a known Windows-specific incremental-compiler bug. Disabling
# incremental compilation avoids the relativeTo() call that trips over
# the cross-drive paths; release builds are slower but reliable.
kotlin.incremental=false
