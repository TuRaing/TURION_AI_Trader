name: Watchlist Paper Trade Check

on:
  # Updated: 2026-07-21 - dropped the native `schedule:` trigger. GitHub's
  # free-tier cron scheduler was badly under-firing this (~4 runs/day
  # instead of the intended ~32) regardless of granularity, and keeping it
  # alongside the external cron-job.org trigger below just caused git-push
  # races (two near-simultaneous runs both committing). cron-job.org now
  # POSTs to this workflow's dispatch endpoint every 15 min (:07/:22/:37/:52,
  # 03:00-10:00 UTC, Mon-Fri) instead.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watchlist paper trade check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watchlist_paper_trade.py

      - name: Commit updated portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add reports/paper_portfolio.json
          git diff --staged --quiet || git commit -m "Update paper trading portfolio [skip ci]"
          git push
