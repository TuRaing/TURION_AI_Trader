name: Watchlist Paper Trade Check

on:
  # Updated: 2026-07-21 - dropped the native `schedule:` trigger. GitHub's
  # free-tier cron scheduler was badly under-firing this (~4 runs/day
  # instead of the intended ~32) regardless of granularity, and keeping it
  # alongside the external cron-job.org trigger below just caused git-push
  # races (two near-simultaneous runs both committing). cron-job.org now
  # POSTs to this workflow's dispatch endpoint every 15 min (:07/:22/:37/:52,
  # 03:00-10:00 UTC, Mon-Fri) instead.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watchlist paper trade check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python watchlist_paper_trade.py

      - name: Commit updated portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            git add reports/paper_portfolio.json
            git diff --staged --quiet && return 0
            git commit -m "Update paper trading portfolio [skip ci]"
            git push
          }

          git pull --rebase origin ${{ github.ref_name }} || true

          for i in 1 2 3; do
            if commit_and_push; then
              exit 0
            fi
            # Same fix as the Best Trade workflows (21-Jul) - a plain rebase
            # retry can't always resolve a race against another workflow's
            # push to the same branch (e.g. Best Trade Entry Scan fires
            # every 1 min, so it can collide with this 15-min run even
            # though they touch different files). Discard this run's local
            # write, sync to whatever actually landed on origin, and
            # re-run the check against that real state instead.
            echo "Push rejected - re-syncing to latest and re-running the check against it ($i/3)..."
            git rebase --abort 2>/dev/null || true
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python watchlist_paper_trade.py
            sleep 3
          done

          echo "Could not sync after 3 attempts - leaving it for the next scheduled run."
          exit 1
