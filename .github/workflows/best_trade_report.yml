name: Best Trade Shortlist Refresh

on:
  schedule:
    # 03:15 UTC = 08:45 IST, Mon-Fri - one pre-market run so a shortlist
    # already exists by the time entries are allowed (10:00 IST) - analysis
    # starts before the market even opens, not just once it's running.
    - cron: '15 3 * * 1-5'
    # :05/:35 past the hour, 04-08 UTC = ~09:35-14:05 IST, Mon-Fri, every 30
    # min (offset from :00/:30 to avoid GitHub Actions' top-of-hour load,
    # same reasoning as the watchlist paper trade cron) - keeps the
    # shortlist's daily-interval trend/news/option-chain context refreshed
    # while the market is open. daily_best_trade.py (every ~5 min) is what
    # actually watches live 15m/5m/1m candles for entries between refreshes.
    - cron: '5,35 4-8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  best-trade-shortlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh best trade shortlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python refresh_shortlist.py

      - name: Commit updated shortlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add reports/best_trade_shortlist.json || true
          git diff --staged --quiet || git commit -m "Refresh best trade shortlist [skip ci]"
          git push
