name: Daily Best Trade Report

on:
  schedule:
    # :05/:35 past the hour, 04-08 UTC = ~09:35-14:05 IST, Mon-Fri, every 30
    # min (offset from :00/:30 to avoid GitHub Actions' top-of-hour load, same
    # reasoning as the watchlist paper trade cron). The script itself skips
    # the scan on every run once today's position is already open, and stops
    # opening new ones within LAST_ENTRY_CUTOFF (14:45 IST) of the 15:15 IST
    # square-off - so this isn't 10 redundant picks a day, just 10 chances to
    # catch a good one as early as possible.
    - cron: '5,35 4-8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  best-trade-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily best trade report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_best_trade.py

      - name: Commit updated best trade portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/best_trade_portfolio.json
          git diff --staged --quiet || git commit -m "Update best trade portfolio [skip ci]"
          git push
