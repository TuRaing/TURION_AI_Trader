name: Fyers Options Watch

# Added 05-Aug-2026 - the FAST half of Fyers continuous automation:
# checks the options paper-trading position every ~1 min (real option
# premium can move several % within a single minute - see 04-Aug's
# leverage research), reusing the FYERS_ACCESS_TOKEN repo secret shared
# by the morning login (fyers_trigger_run.py) - no fresh login here.
# Deliberately minimal (only fyers_options_watch_run.py, not the full
# task list) so a 1-min cadence doesn't cause overlapping/queued runs.
# Triggered externally by cron-job.org, same pattern as the existing
# yfinance workflows.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fyers-options-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run options position check
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        run: python fyers_options_watch_run.py

      - name: Commit updated options portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/fyers_options_portfolio.json || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # FIXED 06-Aug-2026 - see the same-day fix in fyers_scheduled_
          # check.yml: reset --hard on a push conflict discards this
          # run's real result instead of just losing time. Commit first,
          # then rebase-and-retry on conflict so the work survives.
          git commit -m "Update Fyers options portfolio (watch) [skip ci]"

          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected - rebasing this run's commit onto latest ($i/3)..."
            git pull --rebase origin ${{ github.ref_name }}
          done

          echo "Could not push after 3 attempts - commit still exists locally for the next run (~1 min later)."
          exit 1
