name: Best Trade Square-Off

on:
  schedule:
    # 09:15 UTC = 14:45 IST, Mon-Fri (45 min before NSE closes at 15:30 IST) -
    # force-closes today's Best Trade paper position (if still open) so it
    # never silently carries over to the next day. Matches
    # daily_best_trade.py's LAST_ENTRY_CUTOFF (14:15 IST), which leaves a
    # 30-min buffer before this runs.
    - cron: '15 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  best-trade-squareoff:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run best trade square-off
        run: python square_off_best_trade.py

      - name: Commit updated best trade portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            git add reports/best_trade_portfolio.json || true
            git diff --staged --quiet && return 0
            git commit -m "Square off best trade [skip ci]"
            git push
          }

          git pull --rebase origin ${{ github.ref_name }} || true

          for i in 1 2 3; do
            if commit_and_push; then
              exit 0
            fi
            echo "Push rejected - re-syncing to latest and re-running square-off against it ($i/3)..."
            git rebase --abort 2>/dev/null || true
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python square_off_best_trade.py
            sleep 3
          done

          echo "Could not sync after 3 attempts - leaving it for the next scheduled run."
          exit 1
