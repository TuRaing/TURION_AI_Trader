name: Fyers Scheduled Check

# Added 05-Aug-2026 - the continuous, every-few-minutes half of the
# automation: reuses the FYERS_ACCESS_TOKEN repo secret that fyers_
# trigger_run.py shared after the user's ONE morning login (see
# .github/workflows/fyers_trigger.yml) - no login here. Triggered
# externally by cron-job.org hitting workflow_dispatch (same pattern
# as the existing yfinance Watchlist/Best Trade Entry Scan workflows -
# GitHub's own free-tier `schedule:` cron under-fires badly, already
# documented in doc/PROJECT_STATUS.md's Known Issues).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fyers-scheduled-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled Fyers check
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fyers_scheduled_run.py

      - name: Commit updated Fyers state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # One `git add <file> || true` per file, not a combined
          # multi-path line - see the 05-Aug fix in fyers_trigger.yml
          # (a single missing file among several silently discards
          # staging ALL of them, `|| true` alone doesn't prevent that).
          git add reports/options_premium_history.jsonl || true
          # Added 18-Aug-2026 - reports/options_depth_history.jsonl was
          # never added here when the depth collector itself was built
          # (17-Aug) - found while checking how much real depth data had
          # accumulated: the file didn't exist AT ALL, even though
          # snapshot() creates it (open(..., "a")) on its very first
          # line, before any network call. Confirmed via strategy/fyers_
          # depth_collector.py's own code, not assumed. Root cause: this
          # workflow's ephemeral runner was creating + writing the file
          # every run, but never staging it - so it was silently
          # discarded at the end of every single run since 17-Aug, same
          # missing-git-add class of bug as fyers_trigger.yml's 05-Aug
          # fix referenced in the comment above.
          git add reports/options_depth_history.jsonl || true
          git add reports/fyers_test_portfolio.json || true
          git add reports/fyers_best_trade_portfolio.json || true
          git add reports/fyers_options_portfolio.json || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # FIXED 06-Aug-2026 - the previous version reset --hard'd to
          # origin on a push conflict, which DISCARDS this run's just-
          # computed Swing/Intraday results entirely (confirmed live:
          # real "0 Swing event(s)"/alignment-check output was silently
          # lost to a race against the ~1-min-cadence Options Watch
          # workflow pushing to the same branch - the run still reported
          # "success" with nothing actually saved). Commit FIRST so the
          # real work is a durable local commit, then on a push conflict
          # rebase it onto the latest origin (replays cleanly since this
          # workflow's files don't overlap what other workflows touch)
          # instead of throwing it away.
          git commit -m "Update Fyers state (scheduled check) [skip ci]"

          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected - rebasing this run's commit onto latest ($i/3)..."
            git pull --rebase origin ${{ github.ref_name }}
          done

          echo "Could not push after 3 attempts - commit still exists locally for the next run."
          exit 1
