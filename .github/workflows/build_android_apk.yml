name: Build Android APK

# Manual only - builds the Flutter app's release APK on GitHub's runner so
# the user never needs Flutter/Android SDK installed locally just to get an
# installable APK. Same debug-signed release config the app already uses
# for local builds (see mobile_app/android/app/build.gradle.kts) - no
# separate signing key needed. Download the APK from this run's "Artifacts"
# section, then `adb install -r` it on the phone.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # --dart-define=GITHUB_PAT - FIXED 24-Aug-2026, real bug caught
        # live (Fyers login screen showed "App was built without a
        # GITHUB_PAT (--dart-define) - the trigger cannot be sent" on a
        # phone install from this exact workflow's own artifact). This
        # workflow's original plain `flutter build apk --release` never
        # carried the token every prior local build already needed (see
        # fyers_login_screen.dart's own module comment) - REPO_ADMIN_PAT
        # is the same fine-grained, Actions:write-only PAT already used
        # by .github/workflows/fyers_trigger.yml's own dispatch call,
        # reused here rather than creating a second secret for the same
        # token.
        run: flutter build apk --release --dart-define=GITHUB_PAT=${{ secrets.REPO_ADMIN_PAT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: turion-ai-trader-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
