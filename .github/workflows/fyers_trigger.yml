name: Fyers Login Trigger

# Added 04-Aug-2026 - fired by the app's in-app WebView "Login to Fyers"
# button (see mobile_app/lib/screens/fyers_login_screen.dart), passing
# the one-time auth_code it captured from the OAuth redirect. This is
# the ONLY thing that makes strategy/fyers_options_collector.py,
# fyers_paper_trading.py, fyers_daily_best_trade.py, and fyers_
# options_paper_trading.py runnable without the user manually running
# Python commands each day - Fyers' access token is a DAILY token, so
# this needs to fire once per trading day (the user taps the button).
#
# FYERS_APP_ID / FYERS_SECRET_KEY must be added as repository secrets
# (Settings -> Secrets and variables -> Actions) before this can work -
# a one-time manual step only the repo owner can do (Claude cannot add
# GitHub secrets on the user's behalf).

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'One-time Fyers OAuth auth_code from the login redirect'
        required: true

permissions:
  contents: write

jobs:
  fyers-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run today's Fyers tasks
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_AUTH_CODE: ${{ inputs.auth_code }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fyers_trigger_run.py

      - name: Commit updated Fyers state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            git add reports/options_premium_history.jsonl reports/fyers_test_portfolio.json reports/fyers_best_trade_portfolio.json reports/fyers_options_portfolio.json
            git diff --staged --quiet && return 0
            git commit -m "Update Fyers state (login trigger) [skip ci]"
            git push
          }

          git pull --rebase origin ${{ github.ref_name }} || true

          for i in 1 2 3; do
            if commit_and_push; then
              exit 0
            fi
            echo "Push rejected - re-syncing to latest ($i/3)..."
            git rebase --abort 2>/dev/null || true
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            sleep 3
          done

          echo "Could not sync after 3 attempts - state from this run may not be committed."
          exit 1
