name: Best Trade Entry Scan

on:
  schedule:
    # Every 5 min (GitHub's actual schedule floor), 03:50-09:15 UTC =
    # ~09:20-14:45 IST, Mon-Fri. Runs from market open - the entry-timing
    # gates (ENTRY_START 10:00 IST, LAST_ENTRY_CUTOFF 14:15 IST) live inside
    # daily_best_trade.py itself, not in this cron schedule, so this can
    # start as soon as the market opens and still do useful work (checking
    # an already-open position's Stop Loss/Target, or just analysing without
    # opening yet).
    - cron: '*/5 3-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  best-trade-entry-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run best trade entry scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_best_trade.py

      - name: Commit updated best trade portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add reports/best_trade_portfolio.json
          git diff --staged --quiet || git commit -m "Update best trade portfolio [skip ci]"
          git push
