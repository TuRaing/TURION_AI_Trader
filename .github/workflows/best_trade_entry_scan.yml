name: Best Trade Entry Scan

on:
  # Updated: 2026-07-21 - dropped the native `schedule:` trigger. GitHub's
  # free-tier cron scheduler was badly under-firing this (~3 runs/day
  # instead of the intended ~84) regardless of granularity, and keeping it
  # alongside the external cron-job.org trigger below just caused git-push
  # races (two near-simultaneous runs both committing). cron-job.org now
  # POSTs to this workflow's dispatch endpoint every 1 min, 03:00-09:00 UTC,
  # Mon-Fri instead. The entry-timing gates (ENTRY_START 10:00 IST,
  # LAST_ENTRY_CUTOFF 14:15 IST) live inside daily_best_trade.py itself, not
  # in this trigger, so it can start as soon as the market opens and still
  # do useful work (checking an already-open position's Stop Loss/Target,
  # or just analysing without opening yet).
  workflow_dispatch:

permissions:
  contents: write

# Added 26-Aug-2026, real bug found live: with runs firing every ~1 min
# and no concurrency control at all, two overlapping runs could both be
# mid-commit at once - `git pull --rebase --autostash` (below) stashes
# local changes, pulls, then pops the stash, and a stash-pop conflict
# leaves RAW `<<<<<<< Updated upstream` / `=======` / `>>>>>>> Stashed
# changes` markers in the working file (confirmed: this exact marker
# style is git's own autostash-conflict format, distinct from a normal
# rebase/merge conflict's "HEAD"/branch-name markers) - and the retry
# loop's own `|| true` on that line silently swallowed the failure
# instead of catching it, so the corrupted file got `git add`ed and
# committed as-is. reports/best_trade_portfolio.json sat broken on main
# for real, crashing every single run's "Run best trade entry scan"
# step with a JSONDecodeError until this was manually found and fixed.
# One shared concurrency group serializes every run of this workflow -
# same fix, same reasoning as fyers_multi_strategy_options.yml's own
# 26-Aug-2026 widening - eliminates the overlapping-runs precondition
# this bug needed in the first place.
concurrency:
  group: best-trade-entry-scan
  cancel-in-progress: false

jobs:
  best-trade-entry-scan:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run best trade entry scan
        run: python daily_best_trade.py

      - name: Commit updated best trade portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Added 26-Aug-2026 - see this file's own concurrency-group note
          # above for the real incident. A corrupt (unparseable) portfolio
          # JSON must never be committed, no matter what caused it - this
          # is the second, independent line of defense (the concurrency
          # group above is the first, removing the overlapping-runs
          # precondition; this catches any OTHER cause too).
          validate_json() {
            python -c "import json; json.load(open('reports/best_trade_portfolio.json'))"
          }

          commit_and_push() {
            if ! validate_json; then
              echo "reports/best_trade_portfolio.json is not valid JSON - refusing to commit it."
              return 1
            fi
            git add reports/best_trade_portfolio.json reports/best_trade_pick.json reports/alignment_history.jsonl || true
            git diff --staged --quiet && return 0
            git commit -m "Update best trade portfolio [skip ci]"
            git push
          }

          # FIXED 26-Aug-2026, real bug found live: the old blind `|| true`
          # here swallowed a stash-pop conflict from --autostash (its own
          # distinct "<<<<<<< Updated upstream"/"Stashed changes" marker
          # style, not a normal rebase conflict) - the working file was
          # left with raw conflict markers in it, and nothing downstream
          # caught that before committing. Now: on any failure here
          # (rebase conflict OR a failed autostash pop), cleanly abort
          # whatever git operation is mid-flight and hard-reset to the
          # last known-good origin state instead of silently limping on
          # with a possibly-corrupted working tree.
          if ! git pull --rebase --autostash origin ${{ github.ref_name }}; then
            echo "Initial pull --rebase --autostash failed (or left a conflict) - resetting to clean origin state."
            git rebase --abort 2>/dev/null || true
            git stash drop 2>/dev/null || true
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python daily_best_trade.py
          fi

          for i in 1 2 3; do
            if commit_and_push; then
              exit 0
            fi
            # A plain rebase can't safely merge two runs' conflicting decisions
            # (e.g. both opened a position independently) - discard this run's
            # local write, sync to whatever the other run actually landed, and
            # re-run the scan against that real state instead. The script only
            # acts/notifies on genuine state changes, so re-running it here is
            # safe and gives the right answer either way (skip if the other
            # run's decision already covers it, act if it doesn't).
            echo "Push rejected - re-syncing to latest and re-running the scan against it ($i/3)..."
            git rebase --abort 2>/dev/null || true
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python daily_best_trade.py
            sleep 3
          done

          echo "Could not sync after 3 attempts - leaving it for the next scheduled run."
          exit 1
