name: Fyers Multi-Strategy Options Watch

# Added 06-Aug-2026 - runs the named options strategies (simple_st1,
# st2, st3, st4) x 2 indices (NIFTY, BANKNIFTY), reusing the
# FYERS_ACCESS_TOKEN repo secret shared by the morning login
# (fyers_trigger_run.py) - no fresh login here. Separate from fyers_
# options_watch.yml (the original single live strategy, untouched) -
# own workflow, own report files, per this repo's engine-separation
# rule.
#
# UPDATED 06-Aug-2026 (same day) - the `strategy` input lets the same
# workflow be triggered per-strategy instead of only "all 8 at once",
# so the user can independently pause/resume one strategy from cron-
# job.org's dashboard (disable that one job) without touching the
# others - set up 4 separate cron-job.org jobs, one per strategy, each
# POSTing {"ref":"main","inputs":{"strategy":"<name>"}} at ~1-min
# cadence (matching the single-strategy watch's cadence, since each
# job now only does one strategy's worth of work, not all 8's) - see
# doc/06aug26_SESSION_LOG.md. Triggered externally by cron-job.org,
# same pattern as every other Fyers workflow (GitHub's free-tier
# native `schedule:` trigger badly under-fires, already documented in
# doc/PROJECT_STATUS.md's Known Issues).

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy name (simple_st1/st2/st3/st4/gapfill/vix_filter/oi_footprint/credit_spread/pcr_momentum/max_pain_drift/pcr_vix_combo/oi_iv_combo/simple_st1_slcap/st2_slcap/st3_slcap/oi_hybrid_sl/oi_hybrid_sl_trailing/oi_hybrid_sl_atr/oi_hybrid_sl_breakeven/oi_hybrid_sl_laddered/oi_hybrid_sl_indicator), "threshold" (all profit-lock + threshold-slcap variants), or "all"'
        required: false
        default: 'all'

permissions:
  contents: write

# Added 07-Aug-2026 - found live: 4 separate cron-job.org jobs firing
# every ~1 min each meant a run could still be checking out/installing
# deps/committing when the SAME strategy's next minute fired, causing
# two runs to genuinely conflict writing the same 2 report files
# (confirmed in a real failed run's log: "CONFLICT (content): Merge
# conflict in reports/fyers_options_st2_..._portfolio.json" x2, from
# an overlapping st2 run, not a different-strategy collision). This
# queues same-strategy runs instead of letting them overlap - a run
# for one strategy still proceeds independently of the other 3.
concurrency:
  group: fyers-multi-strategy-${{ inputs.strategy }}
  cancel-in-progress: false

jobs:
  fyers-multi-strategy-options:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run multi-strategy options check
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          STRATEGY_NAME: ${{ inputs.strategy }}
        run: python fyers_multi_strategy_options_run.py

      - name: Refresh Fyers candles
        # Added 06-Aug-2026, moved here (from the 5-min fyers_scheduled_
        # check.yml) at the user's request for fresher chart data - this
        # workflow fires every ~1 min per strategy trigger. Gated to the
        # simple_st1 trigger only (or "all") so it runs once per minute-
        # cycle, not 4x (once per each of the 4 separate cron-job.org
        # jobs hitting this same workflow with different `strategy`
        # inputs) - still not tick-by-tick live (candles are 15m-
        # interval; this only keeps the still-forming candle's Close
        # closer to current), see doc/06aug26_SESSION_LOG.md.
        if: inputs.strategy == 'simple_st1' || inputs.strategy == 'all'
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        run: python refresh_fyers_candles.py

      - name: Commit updated multi-strategy portfolios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # One `git add <file> || true` per file, not a combined
          # multi-path line - a single missing file among several
          # silently discards staging ALL of them (see 05-Aug's fix in
          # fyers_trigger.yml).
          git add reports/fyers_options_simple_st1_nifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_banknifty_portfolio.json || true
          git add reports/fyers_options_st2_nifty_portfolio.json || true
          git add reports/fyers_options_st2_banknifty_portfolio.json || true
          git add reports/fyers_options_st3_nifty_portfolio.json || true
          git add reports/fyers_options_st3_banknifty_portfolio.json || true
          git add reports/fyers_options_st4_nifty_portfolio.json || true
          git add reports/fyers_options_st4_banknifty_portfolio.json || true
          # Added 08-Aug-2026 - gapfill was missing from this list since
          # it was added (07/08-Aug) - its portfolio updates were being
          # computed each run but never committed, silently lost on the
          # next checkout. Fixed here, plus the new threshold group (10
          # more files - same bug would otherwise repeat for them too).
          git add reports/fyers_options_gapfill_nifty_portfolio.json || true
          git add reports/fyers_options_gapfill_banknifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_threshold_nifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_threshold_banknifty_portfolio.json || true
          git add reports/fyers_options_st2_threshold_nifty_portfolio.json || true
          git add reports/fyers_options_st2_threshold_banknifty_portfolio.json || true
          git add reports/fyers_options_st3_threshold_nifty_portfolio.json || true
          git add reports/fyers_options_st3_threshold_banknifty_portfolio.json || true
          git add reports/fyers_options_st4_threshold_nifty_portfolio.json || true
          git add reports/fyers_options_st4_threshold_banknifty_portfolio.json || true
          git add reports/fyers_options_gapfill_threshold_nifty_portfolio.json || true
          git add reports/fyers_options_gapfill_threshold_banknifty_portfolio.json || true
          git add reports/fyers_options_vix_filter_banknifty_portfolio.json || true
          git add reports/fyers_options_oi_footprint_nifty_portfolio.json || true
          git add reports/fyers_options_oi_footprint_banknifty_portfolio.json || true
          git add reports/fyers_options_credit_spread_nifty_portfolio.json || true
          git add reports/fyers_options_credit_spread_banknifty_portfolio.json || true
          git add reports/fyers_options_pcr_momentum_nifty_portfolio.json || true
          git add reports/fyers_options_pcr_momentum_banknifty_portfolio.json || true
          git add reports/fyers_options_max_pain_drift_nifty_portfolio.json || true
          git add reports/fyers_options_max_pain_drift_banknifty_portfolio.json || true
          git add reports/fyers_options_pcr_vix_combo_nifty_portfolio.json || true
          git add reports/fyers_options_pcr_vix_combo_banknifty_portfolio.json || true
          git add reports/fyers_options_oi_iv_combo_nifty_portfolio.json || true
          git add reports/fyers_options_oi_iv_combo_banknifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_slcap_nifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_slcap_banknifty_portfolio.json || true
          git add reports/fyers_options_st2_slcap_nifty_portfolio.json || true
          git add reports/fyers_options_st2_slcap_banknifty_portfolio.json || true
          git add reports/fyers_options_st3_slcap_nifty_portfolio.json || true
          git add reports/fyers_options_st3_slcap_banknifty_portfolio.json || true
          git add reports/fyers_options_st3_threshold_slcap_nifty_portfolio.json || true
          git add reports/fyers_options_st2_threshold_slcap_banknifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_threshold_slcap_nifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_threshold_slcap_banknifty_portfolio.json || true
          git add reports/fyers_options_st2_threshold_slcap_nifty_portfolio.json || true
          git add reports/fyers_options_st3_threshold_slcap_banknifty_portfolio.json || true
          git add reports/fyers_options_st4_threshold_slcap_nifty_portfolio.json || true
          git add reports/fyers_options_st4_threshold_slcap_banknifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_nifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_banknifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_trailing_nifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_trailing_banknifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_atr_nifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_atr_banknifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_breakeven_nifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_breakeven_banknifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_laddered_nifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_laddered_banknifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_indicator_nifty_portfolio.json || true
          git add reports/fyers_options_oi_hybrid_sl_indicator_banknifty_portfolio.json || true
          # Added 18-Aug-2026 - the EXACT same class of bug this file's
          # own 08-Aug fix note above describes (gapfill's portfolio
          # updates silently lost, never committed, because this list
          # is hardcoded and wasn't updated when the book was added).
          # Caught live: st2_threshold_slcap2pctlock opened a real
          # position today (18-Aug) that the log confirmed, but the
          # run logged "No changes to commit" and the position was
          # never pushed - these 4 new 17-Aug books were missing here.
          git add reports/fyers_options_st2_threshold_slcap2pctlock_nifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_threshold_slcap2pctlock_nifty_portfolio.json || true
          git add reports/fyers_options_st2_threshold_trailing2pct_nifty_portfolio.json || true
          git add reports/fyers_options_simple_st1_threshold_trailing2pct_nifty_portfolio.json || true
          git add reports/fyers_candles.json || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Commit first, then rebase-and-retry on a push conflict -
          # never git reset --hard, which discards this run's real
          # result instead of just losing time (the exact bug found
          # and fixed the same day in fyers_scheduled_check.yml).
          git commit -m "Update multi-strategy options portfolios [skip ci]"

          # Added 08-Aug-2026 - 169 real failures on 07-Aug traced to a
          # genuine REBASE CONTENT CONFLICT in reports/fyers_candles.json
          # specifically (not a simple fast-forward-needed case the retry
          # loop already handled) - two overlapping runs both rewrote the
          # whole file, so git's line-based merge couldn't reconcile them.
          # fyers_candles.json is a pure CACHE (fully regenerated fresh by
          # every relevant run, nothing authoritative lives only there),
          # so on a conflict limited to just that file, it's always safe
          # to keep whatever's already on origin and move on - this run's
          # own candle data is superseded again within ~1 minute anyway.
          # Any OTHER conflicted file (real portfolio/trade state) is NOT
          # auto-resolved this way - the loop aborts and fails loudly, so
          # a genuine state conflict still surfaces instead of silently
          # picking a side.
          export GIT_EDITOR=true

          for i in 1 2 3; do

            if git push; then
              exit 0
            fi

            echo "Push rejected - rebasing this run's commit onto latest ($i/3)..."

            if git pull --rebase origin ${{ github.ref_name }}; then
              continue
            fi

            conflicted=$(git diff --name-only --diff-filter=U)
            echo "Rebase conflict in: $conflicted"

            if [ "$conflicted" = "reports/fyers_candles.json" ]; then
              echo "Only the candle cache conflicted - keeping the already-pushed version and continuing."
              git checkout --theirs reports/fyers_candles.json
              git add reports/fyers_candles.json
              git rebase --continue
            else
              echo "Conflict outside the safe-to-discard cache file - aborting, not auto-resolving."
              git rebase --abort
              break
            fi
          done

          echo "Could not push after 3 attempts - commit still exists locally for the next run (~2 min later)."
          exit 1
